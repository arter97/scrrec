<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recorder dashboard</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #0a0f1c; color: #eef2ff; }
    body { margin: 0; padding: 32px; }
    .wrap { margin: auto; }
    header { display: flex; justify-content: space-between; align-items: end; padding-bottom: 18px; border-bottom: 1px solid #28334e; }
    h1, h2 { margin: 0; }
    .connection { color: #94a1c4; }
    .offline { margin: 26px 0; padding: 20px; background: #321c24; border: 1px solid #6e3042; border-radius: 14px; }
    .offline h2 { color: #ff8ea7; }
    .names { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .pill { padding: 8px 12px; background: #5d2636; border-radius: 999px; font-weight: 750; }
    .online { padding: 14px; background: #11192b; border: 1px solid #28334e; border-radius: 14px; }
    .count { color: #83e6ae; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 7px; margin-top: 10px; }
    .client { padding: 7px 10px; background: #182238; border-left: 3px solid #43d68a; border-radius: 6px; }
    .thumb { display: block; width: 100%; aspect-ratio: 16 / 9; margin-top: 6px; background: #0a0f1c; border-radius: 4px; object-fit: contain; }
    .preview { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(5, 8, 16, .75); pointer-events: none; }
    .preview.shown { display: flex; flex-direction: column; gap: 12px; }
    .preview-name { padding: 8px 18px; background: #11192b; border: 1px solid #43d68a; border-radius: 999px; color: #fff; font-size: 1.6rem; font-weight: 800; overflow-wrap: anywhere; text-align: center; max-width: 90vw; }
    .preview-time { margin-top: -4px; padding: 4px 14px; background: #11192b; border-radius: 999px; color: #eef2ff; font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .preview canvas { max-width: 96vw; max-height: calc(96vh - 7rem); border-radius: 6px; box-shadow: 0 10px 40px #000; }
    .client.idle { background: #321c24; border-left-color: #ff5c7a; }
    .client.idle .rate { color: #ff8ea7; font-weight: 700; }
    .rate { float: right; color: #94a1c4; font-size: .85rem; font-variant-numeric: tabular-nums; }
    .user { font-size: .95rem; font-weight: 700; overflow-wrap: anywhere; }
    .empty { margin-top: 14px; color: #8390ad; }
    @media (max-width: 600px) { body { padding: 18px; } header { align-items: start; flex-direction: column; gap: 8px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div><h1>Recorder dashboard</h1><div class="connection" id="updated">Connecting…</div></div>
      <strong id="summary"></strong>
    </header>
    <section class="offline"><h2>Not connected</h2><div id="offline" class="names"></div></section>
    <section class="online"><h2>Connected <span id="count" class="count"></span></h2><div id="connected" class="grid"></div></section>
  </main>
  <div class="preview" id="preview"><div class="preview-name"></div><div class="preview-time"></div><canvas></canvas></div>
  <script>
    const LOG_PREFIX = '[scrrec dashboard]';
    const offlineElement = document.querySelector('#offline');
    const connectedElement = document.querySelector('#connected');
    const updatedElement = document.querySelector('#updated');
    const countElement = document.querySelector('#count');
    const summaryElement = document.querySelector('#summary');
    const knownUsers = new Set();
    const clientElements = new Map();
    const previewElement = document.querySelector('#preview');
    const previewCanvas = previewElement.querySelector('canvas');
    const previewName = previewElement.querySelector('.preview-name');
    const previewTime = previewElement.querySelector('.preview-time');
    let previewEntry = null;

    function showPreview(entry) {
      previewEntry = entry;
      if (!entry.canvas.width) return hidePreview();
      previewName.textContent = entry.username;
      previewTime.textContent = `Last updated at: ${entry.thumbAt ? entry.thumbAt.toLocaleTimeString() : 'unknown'}`;
      previewCanvas.width = entry.canvas.width;
      previewCanvas.height = entry.canvas.height;
      previewCanvas.getContext('2d').drawImage(entry.canvas, 0, 0);
      previewElement.classList.add('shown');
    }

    function hidePreview() {
      previewEntry = null;
      previewElement.classList.remove('shown');
    }
    const emptyConnected = document.createElement('div');
    emptyConnected.className = 'empty';
    emptyConnected.textContent = 'No active recorders.';

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[character]);
    }

    function compareNames(left, right) {
      return left.localeCompare(right, undefined, { sensitivity: 'base', numeric: true });
    }

    function render(state) {
      const offlineNames = [...state.offline].sort(compareNames);
      const connectedClients = [...state.connected].sort((left, right) =>
        compareNames(left.username, right.username) || new Date(left.connected) - new Date(right.connected));
      offlineNames.forEach((name) => knownUsers.add(name));
      connectedClients.forEach((client) => knownUsers.add(client.username));
      offlineElement.innerHTML = offlineNames.length
        ? offlineNames.map((name) => `<span class="pill">${escapeHTML(name)}</span>`).join('')
        : '<span class="empty">Everyone is connected.</span>';
      countElement.textContent = `(${connectedClients.length})`;
      renderClients(connectedClients);
      summaryElement.textContent = `${offlineNames.length} offline`;
      updatedElement.textContent = `Live · updated ${new Date().toLocaleTimeString()}`;
      console.info(LOG_PREFIX, 'State updated', { offline: offlineNames.length, connected: connectedClients.length });
    }

    // Client cards are kept across renders so thumbnails are only redrawn
    // when the server reports a new keyframe.
    function renderClients(clients) {
      const live = new Set(clients.map((client) => client.id));
      for (const [id, entry] of clientElements) {
        if (!live.has(id)) {
          if (previewEntry === entry) hidePreview();
          entry.element.remove();
          clientElements.delete(id);
        }
      }
      const elements = clients.map((client) => {
        let entry = clientElements.get(client.id);
        if (!entry) {
          const element = document.createElement('article');
          element.className = 'client';
          const user = document.createElement('div');
          user.className = 'user';
          user.textContent = client.username;
          const canvas = document.createElement('canvas');
          canvas.className = 'thumb';
          const rate = document.createElement('span');
          rate.className = 'rate';
          user.append(rate);
          element.append(user, canvas);
          entry = { element, canvas, rate, username: client.username, thumb: 0, busy: false };
          const shown = entry;
          canvas.addEventListener('mouseenter', () => showPreview(shown));
          canvas.addEventListener('mouseleave', hidePreview);
          clientElements.set(client.id, entry);
        }
        entry.username = client.username;
        entry.element.classList.toggle('idle', !client.rate);
        const transport = client.transport === 'webtransport' ? 'QUIC · ' : '';
        entry.rate.textContent = `${transport}${((client.rate || 0) / 1000).toFixed(1)} kB/s`;
        if (client.thumb && client.thumb !== entry.thumb) {
          entry.thumb = client.thumb;
          updateThumbnail(client, entry);
        }
        return entry.element;
      });
      connectedElement.replaceChildren(...(elements.length ? elements : [emptyConnected]));
    }

    // Thumbnails are decoded one at a time; many concurrent (hardware) decoders
    // can produce corrupted frames.
    let decodeQueue = Promise.resolve();
    const decoderConfigs = new Map();

    async function thumbnailDecoderConfig(codec) {
      if (!decoderConfigs.has(codec)) {
        decoderConfigs.set(codec, (async () => {
          for (const hardwareAcceleration of ['prefer-software', 'no-preference']) {
            const config = { codec, hardwareAcceleration, optimizeForLatency: true };
            try {
              if ((await VideoDecoder.isConfigSupported(config)).supported) return config;
            } catch (error) {
              // Try the next preference.
            }
          }
          return { codec, optimizeForLatency: true };
        })());
      }
      return decoderConfigs.get(codec);
    }

    function decodeThumbnail(codec, data, draw) {
      const job = decodeQueue.then(async () => {
        const config = await thumbnailDecoderConfig(codec);
        let decoder = null;
        try {
          await new Promise((resolve, reject) => {
            decoder = new VideoDecoder({ output: draw, error: reject });
            decoder.configure(config);
            decoder.decode(new EncodedVideoChunk({ type: 'key', timestamp: 0, data }));
            decoder.flush().then(resolve, reject);
          });
        } finally {
          if (decoder && decoder.state !== 'closed') decoder.close();
        }
      });
      decodeQueue = job.catch(() => {});
      return job;
    }

    async function updateThumbnail(client, entry) {
      if (entry.busy || !('VideoDecoder' in window) || !client.codec) return;
      entry.busy = true;
      const version = entry.thumb;
      const thumbAt = client.thumbAt ? new Date(client.thumbAt) : null;
      try {
        const response = await fetch(`/thumb?id=${client.id}`, { cache: 'no-store' });
        if (!response.ok) return;
        const data = await response.arrayBuffer();
        await decodeThumbnail(client.codec, data, (frame) => {
          // Kept at full resolution so the hover preview stays sharp.
          entry.thumbAt = thumbAt;
          entry.canvas.width = frame.displayWidth;
          entry.canvas.height = frame.displayHeight;
          entry.canvas.getContext('2d').drawImage(frame, 0, 0);
          frame.close();
          if (previewEntry === entry) showPreview(entry);
        });
      } catch (error) {
        console.warn(LOG_PREFIX, 'Thumbnail decode failed', client.username, error);
      } finally {
        entry.busy = false;
        if (entry.thumb !== version && clientElements.get(client.id) === entry) updateThumbnail(client, entry);
      }
    }

    function markDisconnected() {
      render({ offline: [...knownUsers], connected: [] });
      updatedElement.textContent = 'Reconnecting dashboard… · all users considered offline';
      console.warn(LOG_PREFIX, 'Event stream disconnected; all users marked offline');
    }

    const events = new EventSource('/events');
    events.addEventListener('state', (event) => {
      try {
        render(JSON.parse(event.data));
      } catch (error) {
        console.error(LOG_PREFIX, 'Invalid dashboard state', error, event.data);
      }
    });
    events.onerror = markDisconnected;
    events.onopen = () => {
      updatedElement.textContent = 'Connected; waiting for server state…';
      console.info(LOG_PREFIX, 'Event stream connected');
    };
  </script>
</body>
</html>
